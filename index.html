<style>
  :root {
    --prf-teal: #127c70;
    --prf-teal-dark: #0b5a51;
    --prf-orange: #e4632a;
    --prf-gold: #f2a93b;
    --prf-navy: #0d2b36;
    --prf-sand: #fbf7f1;
    --prf-ink: #1d2a30;
    --prf-muted: #5b6b72;
    --prf-card: #ffffff;
    --prf-border: #e6ded2;
    --bs-primary: var(--prf-teal);
    --bs-primary-rgb: 18,124,112;
    --bs-link-color: var(--prf-teal-dark);
    --bs-link-hover-color: var(--prf-orange);
    --bs-body-font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [data-bs-theme="dark"] {
    --prf-sand: #0f1b20;
    --prf-ink: #e8eef0;
    --prf-muted: #9fb1b8;
    --prf-card: #16252b;
    --prf-border: #26393f;
    --bs-body-bg: #0f1b20;
    --bs-body-color: #e8eef0;
    --bs-link-color: #5fd0c1;
    --bs-link-hover-color: var(--prf-gold);
  }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body { background: var(--prf-sand); color: var(--prf-ink); }
  h1, h2, h3, h4, .display-font { font-family: "Raleway", system-ui, sans-serif; font-weight: 800; letter-spacing: -.01em; }
  .text-muted-2 { color: var(--prf-muted) !important; }
  .btn-primary { --bs-btn-bg: var(--prf-teal); --bs-btn-border-color: var(--prf-teal); --bs-btn-hover-bg: var(--prf-teal-dark); --bs-btn-hover-border-color: var(--prf-teal-dark); --bs-btn-active-bg: var(--prf-teal-dark); }
  .btn-outline-primary { --bs-btn-color: var(--prf-teal); --bs-btn-border-color: var(--prf-teal); --bs-btn-hover-color: #fff; --bs-btn-hover-bg: var(--prf-teal); --bs-btn-hover-border-color: var(--prf-teal); --bs-btn-active-bg: var(--prf-teal-dark); --bs-btn-active-border-color: var(--prf-teal-dark); --bs-btn-disabled-color: var(--prf-teal); --bs-btn-disabled-border-color: var(--prf-teal); }
  [data-bs-theme="dark"] .btn-outline-primary { --bs-btn-color: #5fd0c1; --bs-btn-border-color: #3aa597; --bs-btn-hover-color: #0f1b20; --bs-btn-hover-bg: #5fd0c1; --bs-btn-hover-border-color: #5fd0c1; }
  .nav-pills { --bs-nav-pills-link-active-bg: var(--prf-teal); --bs-nav-link-color: var(--prf-teal-dark); --bs-nav-link-hover-color: var(--prf-orange); }
  [data-bs-theme="dark"] .nav-pills, [data-bs-theme="dark"] .nav-tabs { --bs-nav-link-color: #5fd0c1; }
  .nav-tabs { --bs-nav-link-color: var(--prf-teal-dark); --bs-nav-link-hover-color: var(--prf-orange); }
  .form-check-input:checked { background-color: var(--prf-teal); border-color: var(--prf-teal); }
  .form-control:focus, .form-check-input:focus { border-color: var(--prf-teal); box-shadow: 0 0 0 .2rem rgba(18,124,112,.25); }
  .btn-accent { --bs-btn-color:#fff; --bs-btn-bg: var(--prf-orange); --bs-btn-border-color: var(--prf-orange); --bs-btn-hover-color:#fff; --bs-btn-hover-bg:#c94f1b; --bs-btn-hover-border-color:#c94f1b; --bs-btn-active-bg:#c94f1b; }
  .text-teal { color: var(--prf-teal) !important; }
  [data-bs-theme="dark"] .text-teal { color: #5fd0c1 !important; }
  .text-orange { color: var(--prf-orange) !important; }
  .bg-teal { background: var(--prf-teal) !important; color: #fff; }
  .bg-navy { background: var(--prf-navy) !important; color: #fff; }
  .accent-bar { width: 96px; height: 6px; background: linear-gradient(90deg, var(--prf-teal) 0 50%, var(--prf-orange) 50% 100%); border-radius: 3px; }
  .prf-card { background: var(--prf-card); border: 1px solid var(--prf-border); border-radius: 1rem; }
  .prf-card.hover:hover { transform: translateY(-3px); box-shadow: 0 .75rem 1.5rem rgba(13,43,54,.12); }
  .prf-card.hover { transition: transform .2s, box-shadow .2s; }
  .icon-bubble { width: 3rem; height: 3rem; border-radius: 50%; display: inline-grid; place-items: center; background: rgba(18,124,112,.12); color: var(--prf-teal); font-size: 1.35rem; flex-shrink: 0; }
  [data-bs-theme="dark"] .icon-bubble { color: #5fd0c1; background: rgba(95,208,193,.12); }
  .section { padding-block: 4rem; }
  .section-sm { padding-block: 2.5rem; }

  /* Navbar */
  .navbar-prf { background: rgba(13,43,54,.94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .navbar-prf .nav-link { color: rgba(255,255,255,.82); font-weight: 500; border-radius: .5rem; padding-inline: .7rem !important; }
  .navbar-prf .nav-link:hover, .navbar-prf .nav-link.active { color: #fff; background: rgba(255,255,255,.1); }
  .brand-mark { font-family: "Raleway", sans-serif; font-weight: 800; color: #fff; line-height: 1.05; }
  .brand-mark small { display: block; font-weight: 500; font-size: .7rem; letter-spacing: .08em; color: var(--prf-gold); text-transform: uppercase; }

  /* Hero */
  .hero { position: relative; min-height: 88vh; display: flex; align-items: center; color: #fff;
          background: linear-gradient(180deg, rgba(13,43,54,.55) 0%, rgba(13,43,54,.35) 45%, rgba(13,43,54,.9) 100%), url("banner.jpeg") center/cover no-repeat, var(--prf-navy); }
  .hero .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--prf-gold); }
  .hero h1 { font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: 1.02; text-shadow: 0 2px 20px rgba(0,0,0,.35); }
  .hero .lead { text-shadow: 0 1px 10px rgba(0,0,0,.4); }
  .countdown .unit { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: .9rem; min-width: 5.2rem; padding: .6rem .4rem; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .countdown .num { font-family: "Raleway", sans-serif; font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1; }
  .countdown .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
  .page-hero { background: linear-gradient(120deg, rgba(13,43,54,.92), rgba(18,124,112,.85)), url("banner.jpeg") center/cover; color: #fff; padding-block: 4.5rem 3rem; }
  .page-hero h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); }

  /* Timeline */
  .timeline { position: relative; padding-left: 2rem; list-style: none; margin: 0; }
  .timeline::before { content: ""; position: absolute; left: .55rem; top: .3rem; bottom: .3rem; width: 3px; background: linear-gradient(var(--prf-teal), var(--prf-orange)); border-radius: 2px; }
  .timeline li { position: relative; margin-bottom: 1.4rem; }
  .timeline li::before { content: ""; position: absolute; left: -1.83rem; top: .35rem; width: 1rem; height: 1rem; border-radius: 50%; background: var(--prf-card); border: 3px solid var(--prf-teal); }
  .timeline li.done::before { background: var(--prf-teal); }
  .timeline li.highlight::before { border-color: var(--prf-orange); background: var(--prf-orange); }

  /* Schedule */
  .sched-row { border-left: 4px solid var(--prf-teal); }
  .sched-row.type-meeting { border-left-color: #6f42c1; }
  .sched-row.type-social { border-left-color: var(--prf-orange); }
  .sched-row.type-service { border-left-color: var(--prf-gold); }
  .sched-time { font-variant-numeric: tabular-nums; min-width: 9.5rem; font-weight: 600; }

  /* Flyer */
  .flyer { width: 100%; max-width: 560px; aspect-ratio: 8.5 / 11; margin-inline: auto; background: #fff; color: #0d2b36; border-radius: .5rem; overflow: hidden; box-shadow: 0 1rem 2.5rem rgba(0,0,0,.18); display: flex; flex-direction: column; font-family: "Inter", sans-serif; }
  .flyer .f-top { background: var(--prf-navy); color: #fff; text-align: center; padding: 5% 6% 4%; }
  .flyer .f-top .std { font-family: "Raleway", sans-serif; font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.6rem); letter-spacing: .04em; line-height: 1; }
  .flyer .f-top .ttl { font-family: "Raleway", sans-serif; font-weight: 800; color: var(--prf-gold); font-size: clamp(1rem, 3.6vw, 1.55rem); margin-top: .35rem; }
  .flyer .f-date { background: var(--prf-orange); color: #fff; text-align: center; font-family: "Raleway", sans-serif; font-weight: 800; font-size: clamp(1.1rem, 4vw, 1.7rem); padding: 2.2% 0; letter-spacing: .03em; }
  .flyer .f-img { flex: 1 1 auto; min-height: 22%; background: url("banner.jpeg") center/cover; }
  .flyer .f-body { background: var(--prf-teal); color: #fff; padding: 4% 6%; display: flex; gap: 4%; align-items: center; }
  .flyer .f-body .hotel { font-family: "Raleway", sans-serif; font-weight: 800; font-size: clamp(1rem, 3.4vw, 1.4rem); }
  .flyer .f-body p { margin: 0; font-size: clamp(.72rem, 2.2vw, .95rem); }
  .flyer .f-qr { background: #fff; padding: 6px; border-radius: 6px; flex-shrink: 0; width: 26%; }
  .flyer .f-qr img, .flyer .f-qr canvas { width: 100% !important; height: auto !important; display: block; }
  .flyer .f-foot { background: #fff; text-align: center; padding: 3% 6%; font-size: clamp(.66rem, 2vw, .85rem); }
  .flyer .f-foot strong { font-family: "Raleway", sans-serif; font-size: clamp(.85rem, 2.8vw, 1.15rem); color: var(--prf-teal); display: block; }

  /* Map */
  .map-box { height: 420px; border-radius: 1rem; overflow: hidden; border: 1px solid var(--prf-border); z-index: 0; }
  .map-box.sm { height: 340px; }

  /* Forms */
  .form-frame { width: 100%; min-height: 900px; border: 0; background: #fff; border-radius: .75rem; }
  .demo-ribbon { background: repeating-linear-gradient(45deg, rgba(242,169,59,.18) 0 12px, rgba(242,169,59,.08) 12px 24px); border: 1px dashed var(--prf-gold); }

  /* Misc */
  .badge-soft { background: rgba(18,124,112,.12); color: var(--prf-teal-dark); font-weight: 600; }
  [data-bs-theme="dark"] .badge-soft { color: #5fd0c1; background: rgba(95,208,193,.14); }
  .badge-soft-orange { background: rgba(228,99,42,.14); color: #b4461a; font-weight: 600; }
  [data-bs-theme="dark"] .badge-soft-orange { color: #ffab80; }
  .stat .num { font-family: "Raleway", sans-serif; font-weight: 800; font-size: 2.6rem; color: var(--prf-teal); line-height: 1; }
  [data-bs-theme="dark"] .stat .num { color: #5fd0c1; }
  .accordion { --bs-accordion-bg: var(--prf-card); --bs-accordion-border-color: var(--prf-border); --bs-accordion-active-bg: rgba(18,124,112,.1); --bs-accordion-active-color: var(--prf-ink); --bs-accordion-btn-focus-box-shadow: 0 0 0 .2rem rgba(18,124,112,.25); }
  .skip-link { position: absolute; left: -999px; top: 0; z-index: 2000; }
  .skip-link:focus { left: 1rem; top: 1rem; }
  .footer { background: var(--prf-navy); color: rgba(255,255,255,.8); }
  .footer a { color: #fff; }
  .footer a:hover { color: var(--prf-gold); }
  .area-chip { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; border-radius: .75rem; background: var(--prf-card); border: 1px solid var(--prf-border); text-decoration: none; color: inherit; height: 100%; }
  .area-chip:hover { border-color: var(--prf-teal); color: inherit; }
  .area-chip .num { font-family: "Raleway", sans-serif; font-weight: 800; color: #fff; background: var(--prf-teal); border-radius: .5rem; min-width: 2.6rem; text-align: center; padding: .15rem .3rem; }
  .area-chip.host .num { background: var(--prf-orange); }
  .back-to-top { position: fixed; right: 1rem; bottom: 1rem; z-index: 1030; }
  [x-cloak] { display: none !important; }
  .page { animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
  main { overflow-x: clip; }
  @media (max-width: 575.98px) {
    .row.g-5 { --bs-gutter-x: 1.5rem; --bs-gutter-y: 2rem; }
    .section { padding-block: 2.75rem; }
    .countdown .unit { min-width: 4.2rem; }
    .sched-time { min-width: 100%; }
    .hero { min-height: 92vh; }
  }
  @media print {
    .navbar, .footer, .no-print, .back-to-top, .page-hero, .toast-container { display: none !important; }
    body { background: #fff; }
    .flyer { box-shadow: none; max-width: 100%; }
    .page:not(.print-target) { display: none !important; }
  }
</style>
</head>
<body x-data="app" x-init="init()" :class="'route-' + route">

<a class="skip-link btn btn-light" href="#main" x-text="t('ui.skip')">Skip to content</a>

<!-- ==================== NAVBAR ==================== -->
<nav class="navbar navbar-expand-xl navbar-dark navbar-prf fixed-top no-print" aria-label="Main navigation">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#/">
      <span class="icon-bubble" style="background:rgba(255,255,255,.12);color:var(--prf-gold);width:2.4rem;height:2.4rem;font-size:1.1rem"><i class="bi bi-sunset-fill"></i></span>
      <span class="brand-mark">PRF 2028<small x-text="t('brand.sub')">Long Beach · MSCA 09</small></span>
    </a>
    <div class="d-flex align-items-center gap-1 order-xl-last ms-auto ms-xl-2">
      <div class="btn-group btn-group-sm" role="group" :aria-label="t('ui.language')">
        <button type="button" class="btn" :class="lang==='en' ? 'btn-light' : 'btn-outline-light'" @click="setLang('en')" :aria-pressed="lang==='en'">EN</button>
        <button type="button" class="btn" :class="lang==='es' ? 'btn-light' : 'btn-outline-light'" @click="setLang('es')" :aria-pressed="lang==='es'">ES</button>
      </div>
      <button type="button" class="btn btn-sm btn-outline-light" @click="toggleTheme()" :title="t('ui.theme')" :aria-label="t('ui.theme')">

      </button>
      <button class="navbar-toggler ms-1" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" :aria-label="t('ui.menu')">
        <span class="navbar-toggler-icon"></span>
      </button>

      <ul class="navbar-nav ms-xl-auto mb-2 mb-xl-0">

<main id="main" tabindex="-1">
<!-- ==================== PAGE: HOME ==================== -->
<div class="page" x-show="route === ''" x-cloak>
  <header class="hero">
    <div class="container py-5 mt-5">
      <div class="row">
        <div class="col-lg-9 col-xl-8">
          <p class="eyebrow mb-2" data-aos="fade-up" x-text="t('home.eyebrow')"></p>
          <h1 class="mb-3" data-aos="fade-up" data-aos-delay="50" x-html="t('home.title')"></h1>
          <p class="lead fs-4 mb-1" data-aos="fade-up" data-aos-delay="100"><i class="bi bi-calendar3 me-2"></i><strong x-text="t('event.dates')"></strong></p>
          <p class="lead mb-4" data-aos="fade-up" data-aos-delay="120"><i class="bi bi-geo-alt-fill me-2"></i><span x-text="cfg.venue.name + ' · ' + cfg.venue.street + ', ' + cfg.venue.city"></span></p>

          <div class="countdown d-flex flex-wrap gap-2 mb-4" data-aos="fade-up" data-aos-delay="150" role="timer" :aria-label="t('home.countdown')">
            <template x-if="!countdown.over">
              <div class="d-flex flex-wrap gap-2">
                <template x-for="u in ['days','hours','minutes','seconds']" :key="u">
                  <div class="unit text-center"><div class="num" x-text="countdown[u]"></div><div class="lbl" x-text="t('time.' + u)"></div></div>
                </template>
              </div>
            </template>
            <template x-if="countdown.over"><div class="unit px-3 num fs-4" x-text="t('home.over')"></div></template>
          </div>

          <div class="d-flex flex-wrap gap-2 align-items-center" data-aos="fade-up" data-aos-delay="200">
            <a href="#/flyer" class="btn btn-accent btn-lg"><i class="bi bi-bookmark-star-fill me-2"></i><span x-text="t('home.ctaSave')"></span></a>
            <a href="#/volunteer" class="btn btn-light btn-lg"><i class="bi bi-hand-thumbs-up-fill me-2"></i><span x-text="t('home.ctaVolunteer')"></span></a>
            <a href="#/about" class="btn btn-outline-light btn-lg"><i class="bi bi-info-circle me-2"></i><span x-text="t('home.ctaLearn')"></span></a>
          </div>
          <div class="mt-3" data-aos="fade-up" data-aos-delay="250">
            <add-to-calendar-button x-ref="atcbHero"
              :name="t('cal.name')" :description="t('cal.desc')"
              startDate="2028-12-01" startTime="18:30" endDate="2028-12-03" endTime="12:00" timeZone="America/Los_Angeles"
              :location="cfg.venue.name + ', ' + cfg.venue.street + ', ' + cfg.venue.city"
              options="'Apple','Google','iCal','Outlook.com','Microsoft365','Yahoo'"
              buttonStyle="round" lightMode="dark" size="4" :language="lang" hideBranding="true" trigger="click"></add-to-calendar-button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Key facts -->
  <section class="section-sm">
    <div class="container">
      <div class="row g-3">
        <template x-for="(f, i) in facts" :key="i">
          <div class="col-6 col-lg-3" data-aos="fade-up" :data-aos-delay="i*60">
            <div class="prf-card p-3 p-md-4 h-100 d-flex gap-3 align-items-start">
              <span class="icon-bubble"><i class="bi" :class="f.icon"></i></span>
              <div><div class="small text-uppercase text-muted-2 fw-semibold" x-text="L(f.label)"></div><div class="fw-semibold" x-text="L(f.value)"></div></div>
            </div>
          </div>
        </template>
      </div>
      <div class="alert border-0 mt-4 mb-0 d-flex gap-3 align-items-start" style="background:rgba(242,169,59,.16)" role="note" data-aos="fade-up">
        <i class="bi bi-megaphone-fill fs-4 text-orange"></i>
        <div>
          <strong x-text="t('home.regTitle')"></strong>
          <div x-text="t('home.regBody')"></div>
          <a href="#/contact" class="fw-semibold" x-text="t('home.regCta')"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- What is a forum teaser -->
  <section class="section pt-3">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-5" data-aos="fade-right">
          <div class="accent-bar mb-3"></div>
          <h2 class="display-6 mb-3" x-text="t('home.whatTitle')"></h2>
          <p class="text-muted-2 fs-5" x-text="t('home.whatBody')"></p>
          <a href="#/about" class="btn btn-primary"><span x-text="t('home.whatCta')"></span><i class="bi bi-arrow-right ms-2"></i></a>
          <a href="https://www.aa.org/regional-forum-video" target="_blank" rel="noopener" class="btn btn-link"><i class="bi bi-play-circle me-1"></i><span x-text="t('home.video')"></span></a>
        </div>

              <label class="form-label small fw-semibold" x-text="t('flyer.langLbl')"></label>

          <div class="prf-card p-4 mb-4">
            <h2 class="h5 mb-2"><i class="bi bi-chat-square-quote text-teal me-2"></i><span x-text="t('flyer.msgTitle')"></span></h2>
            <p class="small text-muted-2" x-text="t('flyer.msgLead')"></p>
            <textarea class="form-control small mb-2" rows="6" readonly x-text="announcement" :aria-label="t('flyer.msgTitle')"></textarea>

          <div class="prf-card p-4">

            <p class="small text-muted-2 mb-0 mt-2"><i class="bi bi-info-circle me-1"></i><span x-text="t('flyer.spreadNote')"></span></p>
          </div>
        </div>
      </div>
    </div>
  </section>

    { id: 'who', cat: 'general', q: { en: 'Who can attend?', es: '¿Quién puede asistir?' }, a: { en: 'Regional Forums are open to all A.A. members and anyone interested in A.A. You do not need to hold a service position.', es: 'Los Foros Regionales están abiertos a todos los miembros de A.A. y a cualquier persona interesada en A.A. No necesita tener un puesto de servicio.' } },
    { id: 'cost', cat: 'attend', q: { en: 'How much does it cost?', es: '¿Cuánto cuesta?' }, a: { en: 'There is <strong>no registration fee</strong>. The General Service Board covers meeting room costs. Attendees pay for their own travel, lodging, parking and meals. Many groups, districts and areas help fund their trusted servants — ask yours!', es: '<strong>No hay costo de inscripción</strong>. La Junta de Servicios Generales cubre las salas. Los asistentes pagan su viaje, hospedaje, estacionamiento y comidas. Muchos grupos, distritos y áreas apoyan a sus servidores de confianza: ¡pregunte!' } },
    { id: 'register', cat: 'attend', q: { en: 'How and when do I register?', es: '¿Cómo y cuándo me inscribo?' }, a: { en: 'Registration is handled by the General Service Office on aa.org and usually opens about two months before the Forum (for 2026 it opened October 2). We will post the link on this site as soon as it is live. <a href="#/contact">Sign up for updates</a>.', es: 'La inscripción la gestiona la Oficina de Servicios Generales en aa.org y suele abrir unos dos meses antes del Foro (en 2026 abrió el 2 de octubre). Publicaremos el enlace aquí en cuanto esté disponible. <a href="#/contact">Reciba novedades</a>.' } },
    { id: 'first', cat: 'attend', q: { en: 'I have never been to a Forum. Is it for me?', es: 'Nunca he ido a un Foro. ¿Es para mí?' }, a: { en: 'Absolutely. At the 2024 Pacific Regional Forum, 588 of 918 attendees were at their first Forum. It is a friendly, welcoming way to learn how A.A. works beyond the home group.', es: 'Por supuesto. En el Foro del Pacífico 2024, 588 de 918 asistentes estaban en su primer Foro. Es una forma amable de aprender cómo funciona A.A. más allá del grupo base.' } },
    { id: 'partial', cat: 'attend', q: { en: 'Can I attend only part of the weekend?', es: '¿Puedo asistir solo parte del fin de semana?' }, a: { en: 'Yes. Come for whatever sessions you can. Late-arrival registration is available Sunday morning.', es: 'Sí. Venga a las sesiones que pueda. Hay inscripción para llegadas tardías el domingo por la mañana.' } },
    { id: 'lang', cat: 'attend', q: { en: 'Will there be Spanish or French interpretation?', es: '¿Habrá interpretación al español o francés?' }, a: { en: 'Regional Forums typically provide simultaneous interpretation equipment. Details will be confirmed with registration. Headsets are checked out near the session room.', es: 'Los Foros Regionales normalmente ofrecen equipo de interpretación simultánea. Los detalles se confirmarán con la inscripción. Los audífonos se prestan cerca de la sala.' } },
    { id: 'hybrid', cat: 'attend', q: { en: 'Can I attend online?', es: '¿Puedo asistir en línea?' }, a: { en: 'A hybrid/broadcast option is being explored by the host committee but is not confirmed. Any decision will be posted here.', es: 'El comité anfitrión está explorando una opción híbrida, pero no está confirmada. Cualquier decisión se publicará aquí.' } },
    { id: 'actions', cat: 'general', q: { en: 'Are votes or decisions made at the Forum?', es: '¿Se vota o se toman decisiones en el Foro?' }, a: { en: 'No. Forums are sharing sessions, so no formal actions result. What is shared is captured in the Forum Final Report distributed to attendees and posted on aa.org.', es: 'No. Los Foros son sesiones para compartir, por lo que no hay acciones formales. Lo compartido se recoge en el Informe Final que se entrega a los asistentes y se publica en aa.org.' } },
    { id: 'askit', cat: 'general', q: { en: 'What is the Ask-It-Basket?', es: '¿Qué es la Canasta de Preguntas?' }, a: { en: 'A basket where anyone can drop a written question — anonymously if you prefer. Trustees and staff answer questions during the weekend.', es: 'Una canasta donde cualquiera puede dejar una pregunta escrita, de forma anónima si lo prefiere. Custodios y personal las responden durante el fin de semana.' } },
    { id: 'meetings', cat: 'attend', q: { en: 'Will there be A.A. meetings?', es: '¿Habrá reuniones de A.A.?' }, a: { en: 'Yes. The host committee arranges A.A. meetings outside Forum sessions — typically Friday at 4:00 p.m. and Saturday/Sunday at 7:30 a.m. You can also use the <a href="https://www.aa.org/meeting-guide-app" target="_blank" rel="noopener">Meeting Guide app</a> to find local meetings.', es: 'Sí. El comité anfitrión organiza reuniones fuera de las sesiones: normalmente el viernes a las 4:00 p. m. y sábado/domingo a las 7:30 a. m. También puede usar la <a href="https://www.aa.org/meeting-guide-app" target="_blank" rel="noopener">app Meeting Guide</a>.' } },
    { id: 'family', cat: 'attend', q: { en: 'Can I bring family or friends?', es: '¿Puedo traer familia o amigos?' }, a: { en: 'Forums are open to anyone interested in A.A. Long Beach also has plenty for family members to enjoy nearby — see <a href="#/travel">Travel</a>.', es: 'Los Foros están abiertos a cualquier persona interesada en A.A. Long Beach también tiene mucho para disfrutar en familia; vea <a href="#/travel">Viaje</a>.' } },
    { id: 'photos', cat: 'attend', q: { en: 'Can I take photos or record sessions?', es: '¿Puedo tomar fotos o grabar las sesiones?' }, a: { en: 'Please do not photograph or record attendees or sessions, and never post identifiable images or full names online. Anonymity is the spiritual foundation of our Traditions.', es: 'Por favor no fotografíe ni grabe a los asistentes o sesiones, y nunca publique imágenes identificables ni nombres completos en línea. El anonimato es la base espiritual de nuestras Tradiciones.' } },
    { id: 'access', cat: 'attend', q: { en: 'I have accessibility needs. Who do I contact?', es: 'Tengo necesidades de accesibilidad. ¿A quién contacto?' }, a: { en: 'Please note them during registration and <a href="#/contact">contact the host committee</a> as early as possible so we can work with GSO and the hotel.', es: 'Indíquelas al inscribirse y <a href="#/contact">contacte al comité anfitrión</a> lo antes posible para coordinar con la OSG y el hotel.' } },
    { id: 'hotel', cat: 'travel', q: { en: 'Where should I stay?', es: '¿Dónde debo hospedarme?' }, a: { en: 'The Forum takes place at the Hilton Long Beach. A discounted A.A. room block will be published with registration. Booking in the block helps the Fellowship meet its hotel commitments.', es: 'El Foro es en el Hilton Long Beach. El bloque de habitaciones con descuento se publicará con la inscripción. Reservar en el bloque ayuda a la Comunidad a cumplir sus compromisos con el hotel.' } },
    { id: 'parking', cat: 'travel', q: { en: 'Is there parking?', es: '¿Hay estacionamiento?' }, a: { en: 'Yes. Current hotel rates are $35/night self-parking and $40/night valet (subject to change). Consider the Metro A Line or carpooling.', es: 'Sí. Las tarifas actuales son $35/noche autoestacionamiento y $40/noche valet (sujetas a cambio). Considere la Línea A de Metro o compartir auto.' } },
    { id: 'airport', cat: 'travel', q: { en: 'Which airport is closest?', es: '¿Cuál es el aeropuerto más cercano?' }, a: { en: 'Long Beach Airport (LGB) is about 15 minutes away. LAX and John Wayne (SNA) are about 22 miles away. <a href="#/travel">See travel details</a>.', es: 'El Aeropuerto de Long Beach (LGB) está a unos 15 minutos. LAX y John Wayne (SNA) están a unas 22 millas. <a href="#/travel">Ver detalles</a>.' } },
    { id: 'extend', cat: 'travel', q: { en: 'Can I extend my stay?', es: '¿Puedo extender mi estadía?' }, a: { en: 'The group rate may be offered up to three days before and after the Forum, based on hotel availability.', es: 'La tarifa de grupo puede ofrecerse hasta tres días antes y después del Foro, según disponibilidad del hotel.' } },
    { id: 'howvol', cat: 'service', q: { en: 'How can I volunteer?', es: '¿Cómo puedo ser voluntario?' }, a: { en: 'Fill out the <a href="#/volunteer">volunteer form</a>. Ten Welcome Committee chair positions will be confirmed at the January 2027 Area 09 Assembly, and many weekend shifts are open to members from any area.', es: 'Complete el <a href="#/volunteer">formulario de voluntarios</a>. Diez puestos de presidente se confirmarán en la Asamblea del Área 09 de enero de 2027, y muchos turnos están abiertos a miembros de cualquier área.' } },
    { id: 'fund', cat: 'service', q: { en: 'Who pays for coffee, hospitality and extra activities?', es: '¿Quién paga el café, la hospitalidad y actividades extra?' }, a: { en: 'A.A. World Services does not pay for coffee, hospitality rooms or A.A. meeting rooms. These are arranged by the host committee on a self-supporting basis. A PRF budget will be submitted to MSCA 09.', es: 'A.A. World Services no paga café, salas de hospitalidad ni salas de reuniones de A.A. El comité anfitrión las organiza de forma automantenida. Se presentará un presupuesto del FRP a MSCA 09.' } },
    { id: 'speak', cat: 'service', q: { en: 'Can someone present about the Forum at our district?', es: '¿Alguien puede presentar sobre el Foro en nuestro distrito?' }, a: { en: 'Yes! <a href="#/contact">Send a presentation request</a> and a host committee member will reach out.', es: '¡Sí! <a href="#/contact">Envíe una solicitud</a> y un miembro del comité se comunicará con usted.' } }
  ]
});
</script>

<script>
/* =====================================================================
   APP (Alpine.js component) — routing, i18n, maps, forms, flyer
   ===================================================================== */
const ROUTES = ['', 'about', 'program', 'volunteer', 'travel', 'flyer', 'resources', 'faq', 'contact'];
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };
const loadScript = (src) => new Promise((resolve, reject) => {
  if (document.querySelector(`script[src="${src}"]`)) return resolve();
  const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
});

document.addEventListener('alpine:init', () => {
  Alpine.data('app', () => ({
    cfg: window.PRF_CONFIG,
    ...window.PRF_DATA,
    nav: [
      { route: '', icon: 'bi-house' }, { route: 'about', icon: 'bi-info-circle' }, { route: 'program', icon: 'bi-calendar3' },
      { route: 'volunteer', icon: 'bi-person-raised-hand' }, { route: 'travel', icon: 'bi-geo-alt' }, { route: 'flyer', icon: 'bi-bookmark-star' },
      { route: 'resources', icon: 'bi-collection' }, { route: 'faq', icon: 'bi-question-circle' }, { route: 'contact', icon: 'bi-envelope' }
    ],
    lang: 'en', flyerLang: 'en', theme: 'light', route: '',
    day: 'fri', volFilter: 'all', volQuery: '', resQuery: '', faqQuery: '', faqCat: 'all',
    poiFilter: 'all', contactTab: 'updates', selectedPosition: null,
    busy: false, toastMsg: '', scrolled: false, spreadDone: [], pendingScroll: null,
    countdown: { days: '–', hours: '–', minutes: '–', seconds: '–', over: false },

    init() {
      // Language: ?lang=es → saved choice → browser language
      const qp = new URLSearchParams(location.search).get('lang');
      const saved = lsGet('prf-lang');
      this.setLang(qp || saved || ((navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en'), false);
      this.flyerLang = this.lang;
      // Theme
      this.theme = lsGet('prf-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', this.theme);
      // Service position status overrides from config
      this.commitments.forEach(c => { c.status = this.cfg.commitmentStatus[c.id] || 'open'; });
      // Saved checklist
      try { this.spreadDone = JSON.parse(lsGet('prf-spread') || '[]'); } catch (e) { this.spreadDone = []; }
      // Countdown
      this.tick(); setInterval(() => this.tick(), 1000);
      // Routing
      window.addEventListener('hashchange', () => this.onRoute());
      this.onRoute(true);
      window.addEventListener('scroll', () => { this.scrolled = window.scrollY > 600; }, { passive: true });
      this.$watch('flyerLang', () => this.$nextTick(() => this.renderQr()));
      this.$watch('theme', () => this.renderQr());
      AOS.init({ once: true, duration: 600, offset: 40 });
    },

    /* ---------- i18n helpers ---------- */
    lookup(lang, key) { return key.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), window.PRF_I18N[lang]); },
    t(key) { const v = this.lookup(this.lang, key); return v !== undefined ? v : (this.lookup('en', key) ?? key); },
    tf(key) { const v = this.lookup(this.flyerLang, key); return v !== undefined ? v : (this.lookup('en', key) ?? key); },
    L(o) { if (o == null) return ''; if (typeof o === 'string') return o; return o[this.lang] ?? o.en ?? ''; },
    H(o) { return DOMPurify.sanitize(this.L(o), { ADD_ATTR: ['target', 'rel'] }); },
    setLang(l, persist = true) {
      this.lang = l === 'es' ? 'es' : 'en';
      document.documentElement.lang = this.lang;
      if (persist) lsSet('prf-lang', this.lang);
      this.updateTitle();
    },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', this.theme);
      lsSet('prf-theme', this.theme);
    },

    /* ---------- routing ---------- */
    onRoute(first = false) {
      const r = location.hash.replace(/^#\/?/, '').split(/[/?#]/)[0];
      // Plain in-page anchors (e.g. #volForm) are not routes
      if (location.hash && !location.hash.startsWith('#/') && document.getElementById(location.hash.slice(1))) return;
      this.route = ROUTES.includes(r) ? r : '';
      this.updateTitle();
      if (!first && !this.pendingScroll) window.scrollTo({ top: 0, behavior: 'instant' });
      this.$nextTick(() => {
        if (this.route === 'about') this.initRegionMap();
        if (this.route === 'travel') this.initTravelMap();
        if (this.route === 'flyer') this.renderQr();
        if (this.pendingScroll) { const id = this.pendingScroll; this.pendingScroll = null; setTimeout(() => this.scrollToId(id), 60); }
        setTimeout(() => AOS.refreshHard(), 50);
      });
    },
    updateTitle() {
      const page = this.route ? this.t('nav.' + this.route) + ' · ' : '';
      document.title = page + this.t('home.title').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() + ' · Long Beach, CA';
    },
    closeMenu() { const el = document.getElementById('navMain'); if (el && el.classList.contains('show')) bootstrap.Collapse.getOrCreateInstance(el).hide(); },
    scrollToId(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    get siteUrl() { return location.href.split('#')[0].split('?')[0]; },

    /* ---------- countdown (Day.js) ---------- */
    tick() {
      const ms = dayjs(this.cfg.eventStart).diff(dayjs());
      if (ms <= 0) { this.countdown.over = true; return; }
      const s = Math.floor(ms / 1000);
      this.countdown.days = Math.floor(s / 86400).toLocaleString();
      this.countdown.hours = String(Math.floor(s % 86400 / 3600)).padStart(2, '0');
      this.countdown.minutes = String(Math.floor(s % 3600 / 60)).padStart(2, '0');
      this.countdown.seconds = String(s % 60).padStart(2, '0');
    },

    /* ---------- search / filters (Fuse.js) ---------- */
    fuse(list, keys, q) { return new Fuse(list, { keys, threshold: 0.25, ignoreLocation: true, minMatchCharLength: 3 }).search(q).map(r => r.item); },
    get filteredCommitments() {
      let list = this.commitments.filter(c => this.volFilter === 'all' || c.phases.includes(this.volFilter));
      if (this.volQuery.trim()) list = this.fuse(list, ['title.en', 'title.es', 'summary.en', 'summary.es', 'duties.en', 'duties.es'], this.volQuery.trim());
      return list;
    },
    get filteredResources() {
      const q = this.resQuery.trim();
      if (!q) return this.resources;
      return this.resources.map(g => ({ ...g, items: this.fuse(g.items, ['name.en', 'name.es', 'desc.en', 'desc.es'], q) })).filter(g => g.items.length);
    },
    get filteredFaq() {
      let list = this.faq.filter(f => this.faqCat === 'all' || f.cat === this.faqCat);
      if (this.faqQuery.trim()) list = this.fuse(list, ['q.en', 'q.es', 'a.en', 'a.es'], this.faqQuery.trim());
      return list;
    },

    /* ---------- Google Forms ---------- */
    formUrl(key, embedded) {
      const f = this.cfg.forms[key];
      const u = new URL(f.url);
      if (embedded) u.searchParams.set('embedded', 'true');
      if (key === 'volunteer' && f.prefillEntry && this.selectedPosition) {
        u.searchParams.set('usp', 'pp_url');
        u.searchParams.set(f.prefillEntry, this.selectedPosition.title.en);
      }
      return u.toString();
    },
    pickPosition(c) { this.selectedPosition = c; this.$nextTick(() => this.scrollToId('volForm')); },

    /* ---------- maps (Leaflet + OpenStreetMap) ---------- */
    tiles() {
      return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
    },
    pin(color, icon, size = 34) {
      return L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2],
        html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:${size * 0.45}px"><i class="bi ${icon}"></i></div>` });
    },
    initRegionMap() {
      if (this._regionMap) { this._regionMap.invalidateSize(); return; }
      const m = L.map('regionMap', { scrollWheelZoom: false });
      this.tiles().addTo(m);
      const pts = [];
      this.areas.forEach(a => {
        const mk = L.marker([a.lat, a.lng], { icon: this.pin(a.host ? '#e4632a' : '#127c70', 'bi-people-fill', a.host ? 34 : 26), title: `Area ${a.num} ${a.name}` }).addTo(m);
        mk.bindPopup(`<strong>Area ${a.num} — ${a.name}</strong><br><a href="${a.url}" target="_blank" rel="noopener">${a.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}</a>`);
        pts.push([a.lat, a.lng]);
      });
      L.marker([this.cfg.venue.lat, this.cfg.venue.lng], { icon: this.pin('#0d2b36', 'bi-star-fill', 36), zIndexOffset: 1000 }).addTo(m).bindPopup(`<strong>PRF 2028</strong><br>${this.cfg.venue.name}`);
      m.fitBounds(pts, { padding: [20, 20] });
      this._regionMap = m;
      setTimeout(() => m.invalidateSize(), 200);
    },
    initTravelMap() {
      if (this._travelMap) { this._travelMap.invalidateSize(); this.setPoiFilter(this.poiFilter); return; }
      const v = this.cfg.venue;
      const m = L.map('travelMap', { scrollWheelZoom: false }).setView([v.lat, v.lng], 15);
      this.tiles().addTo(m);
      L.marker([v.lat, v.lng], { icon: this.pin('#e4632a', 'bi-building', 40), zIndexOffset: 1000 }).addTo(m)
        .bindPopup(`<strong>${v.name}</strong><br>${v.street}<br>${v.city} ${v.zip}`).openPopup();
      this._poiLayer = L.layerGroup().addTo(m);
      this._travelMap = m;
      this.setPoiFilter(this.poiFilter);
      setTimeout(() => { m.invalidateSize(); this.setPoiFilter(this.poiFilter); }, 250);
    },
    setPoiFilter(cat) {
      this.poiFilter = cat;
      if (!this._travelMap) return;
      const icons = { airport: ['#0d6efd', 'bi-airplane-fill'], sights: ['#127c70', 'bi-camera-fill'], food: ['#b8860b', 'bi-shop'], transit: ['#6f42c1', 'bi-train-front-fill'] };
      this._poiLayer.clearLayers();
      const v = this.cfg.venue; const pts = [[v.lat, v.lng]];
      this.pois.filter(p => cat === 'all' || p.cat === cat).forEach(p => {
        L.marker([p.lat, p.lng], { icon: this.pin(icons[p.cat][0], icons[p.cat][1], 28), title: p.name }).addTo(this._poiLayer)
          .bindPopup(`<strong>${p.name}</strong><br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(v.street + ' ' + v.city)}&destination=${p.lat},${p.lng}">Directions / Cómo llegar</a>`);
        pts.push([p.lat, p.lng]);
      });
      if (pts.length > 1) this._travelMap.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
      else this._travelMap.setView(pts[0], 15);
    },

    /* ---------- flyer: QR (qrcodejs), PDF (html2pdf.js), PNG (html2canvas) ---------- */
    renderQr() {
      const el = document.getElementById('flyerQr');
      if (!el || typeof QRCode === 'undefined') return;
      el.innerHTML = '';
      new QRCode(el, { text: this.siteUrl + '#/', width: 256, height: 256, colorDark: '#0d2b36', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    },
    async downloadFlyer(type) {
      const el = document.getElementById('flyerEl');
      const name = `PRF-2028-Save-the-Date-${this.flyerLang.toUpperCase()}`;
      this.busy = true;
      try {
        if (type === 'pdf') {
          await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.14.0/dist/html2pdf.bundle.min.js');
          const w = el.offsetWidth, h = el.offsetHeight;
          await html2pdf().set({
            margin: 0, filename: name + '.pdf', image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 3, useCORS: true, backgroundColor: '#ffffff' },
            jsPDF: { unit: 'px', format: [w, h], orientation: 'portrait', hotfixes: ['px_scaling'] }
          }).from(el).save();
        } else {
          await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
          const canvas = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: '#ffffff' });
          const a = document.createElement('a'); a.download = name + '.png'; a.href = canvas.toDataURL('image/png'); a.click();
        }
      } catch (e) {
        console.error(e); this.toast(this.t('ui.flyerFail'));
      } finally { this.busy = false; }
    },
    get announcement() { return this.t('flyer.announcement').replace('{url}', this.siteUrl); },
    saveSpread() { lsSet('prf-spread', JSON.stringify(this.spreadDone)); },

    /* ---------- share / copy / toast ---------- */
    async share() {
      const data = { title: document.title, text: this.t('ui.shareText'), url: this.siteUrl };
      if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e.name === 'AbortError') return; } }
      this.copy(this.siteUrl, this.t('ui.linkCopied'));
    },
    async copy(text, msg) {
      try { await navigator.clipboard.writeText(text); }
      catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      this.toast(msg || this.t('ui.copied'));
    },
    toast(msg) { this.toastMsg = msg; bootstrap.Toast.getOrCreateInstance(document.getElementById('appToast'), { delay: 3000 }).show(); }
  }));
});
</script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</body>
